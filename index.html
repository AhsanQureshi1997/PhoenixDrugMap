<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phoenix Drug Arrests 2025</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0b0f14;
      --surface: #111820;
      --border:  #1e2a36;
      --accent:  #ff4b2b;
      --accent2: #ff9f43;
      --text:    #e8edf2;
      --muted:   #6b7f8e;
      --card:    #141d27;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Mono', monospace;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-rows: 60px 1fr;
      grid-template-columns: 300px 1fr;
      grid-template-areas: "header header" "sidebar map";
    }

    header {
      grid-area: header;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      clip-path: polygon(50% 0%,100% 38%,82% 100%,18% 100%,0% 38%);
    }
    .logo h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }
    .logo h1 span { color: var(--accent); }
    .header-meta { font-size: 0.6rem; color: var(--muted); text-align: right; line-height: 1.6; }

    aside {
      grid-area: sidebar;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    aside::-webkit-scrollbar { width: 4px; }
    aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .section-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
    }
    .stat-card .val {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent2);
      line-height: 1;
    }
    .stat-card .lbl { font-size: 0.58rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .ctrl-label { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      padding: 7px 10px;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      outline: none;
      appearance: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--accent); }

    /* Offense filter pills */
    .pill-group { display: flex; flex-wrap: wrap; gap: 5px; }
    .pill {
      font-size: 0.58rem;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .pill.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(255,75,43,0.1);
    }

    /* ZIP bars */
    .zone-list { display: flex; flex-direction: column; gap: 6px; }
    .zone-item { display: flex; align-items: center; gap: 8px; }
    .zone-bar-wrap { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .zone-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 3px; transition: width 0.4s; }
    .zone-count { font-size: 0.58rem; color: var(--muted); min-width: 30px; text-align: right; }
    .zone-name { min-width: 56px; color: var(--text); font-size: 0.62rem; }

    /* Monthly spark */
    .spark { display: flex; align-items: flex-end; gap: 2px; height: 40px; }
    .spark-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .spark-bar { width: 100%; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; }
    .spark-lbl { font-size: 0.42rem; color: var(--muted); }

    /* Legend dot */
    .legend-row { display: flex; align-items: center; gap: 8px; font-size: 0.65rem; color: var(--muted); margin-bottom: 4px; }
    .dot-sample { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    #map { grid-area: map; }

    /* Leaflet popup */
    .leaflet-popup-content-wrapper {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      border-radius: 6px !important;
      color: var(--text) !important;
      font-family: 'Space Mono', monospace !important;
      font-size: 0.7rem !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-tip { background: var(--surface) !important; }
    .popup-offense { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.8rem; color: var(--accent2); margin-bottom: 4px; }
    .popup-row { color: var(--muted); margin-top: 2px; }
    .popup-row span { color: var(--text); }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon"></div>
    <h1>PHX <span>Drug Arrests</span> — 2025</h1>
  </div>
  <div class="header-meta">
    Source: City of Phoenix Open Data<br/>

</header>

<aside>

      <div class="stat-card"><div class="val" id="stat-top-month">—</div><div class="lbl">Peak Month</div></div>
    </div>
  </div>

  <div>
    <div class="section-label">Filter by Offense</div>
    <div class="pill-group" id="pill-group"></div>
  </div>

  <div>
    <div class="section-label">Monthly Trend — 2025</div>
    <div class="spark" id="spark"></div>
  </div>

  <div>
    <div class="section-label">Top ZIP Codes</div>
    <div class="zone-list" id="zone-list"></div>

  <div>

  </div>
</aside>

<div id="map"></div>

// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map('map', { center: [33.4484, -112.0740], zoom: 11, zoomControl: false });
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; CARTO', maxZoom: 19
}).addTo(map);

// ── State ─────────────────────────────────────────────────────────────────────
let allRows = [];
let dotLayer = null;
let activeOffenses = new Set(['ALL']);

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ── Parse data ────────────────────────────────────────────────────────────────
INLINE_DATA.features.forEach(f => {
  const [lng, lat] = f.geometry.coordinates;
  const p = f.properties;
  allRows.push({ lat, lng, zip: p.zip || '', offense: p.offense || '', date: p.date || '', year: p.year || '' });
});

// ── Offense types ─────────────────────────────────────────────────────────────
const offenseTypes = [...new Set(allRows.map(r => r.offense).filter(Boolean))].sort();

// ── Filter ────────────────────────────────────────────────────────────────────
function getFiltered() {
  if (activeOffenses.has('ALL')) return allRows;
  return allRows.filter(r => activeOffenses.has(r.offense));
}

// ── Render dots ───────────────────────────────────────────────────────────────
function renderDots(rows) {
  if (dotLayer) map.removeLayer(dotLayer);
  const markers = rows.map(r => {
    const m = L.circleMarker([r.lat, r.lng], {
      radius: 5,
      color: '#ff4b2b',
      fillColor: '#ff9f43',
      fillOpacity: 0.75,
      weight: 1,
      opacity: 0.9
    });
    m.bindPopup(`
      <div class="popup-offense">${r.offense}</div>
      <div class="popup-row">ZIP: <span>${r.zip}</span></div>
      <div class="popup-row">Date: <span>${r.date || '2025'}</span></div>
    `, { maxWidth: 220 });
    return m;
  });
  dotLayer = L.layerGroup(markers).addTo(map);
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats(rows) {
  document.getElementById('stat-total').textContent = rows.length.toLocaleString();
  const zips = new Set(rows.map(r => r.zip).filter(Boolean));
  document.getElementById('stat-zips').textContent = zips.size;

  const zipCount = {};
  rows.forEach(r => { if (r.zip) zipCount[r.zip] = (zipCount[r.zip]||0)+1; });
  const topZip = Object.entries(zipCount).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('stat-top-zip').textContent = topZip ? topZip[0] : '—';

  const monCount = Array(12).fill(0);
  rows.forEach(r => {
    const m = r.date ? parseInt(r.date.slice(5,7)) - 1 : -1;
    if (m >= 0) monCount[m]++;
  });
  const peakM = monCount.indexOf(Math.max(...monCount));
  document.getElementById('stat-top-month').textContent = MONTHS[peakM] || '—';
}

// ── ZIP bars ──────────────────────────────────────────────────────────────────
function updateZones(rows) {
  const zipCount = {};
  rows.forEach(r => { if (r.zip) zipCount[r.zip] = (zipCount[r.zip]||0)+1; });
  const sorted = Object.entries(zipCount).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max = sorted[0]?.[1] || 1;
  document.getElementById('zone-list').innerHTML = sorted.map(([zip, n]) => `
    <div class="zone-item">
      <span class="zone-name">${zip}</span>
      <div class="zone-bar-wrap"><div class="zone-bar" style="width:${(n/max*100).toFixed(1)}%"></div></div>
      <span class="zone-count">${n.toLocaleString()}</span>
    </div>`).join('');
}

// ── Monthly spark ─────────────────────────────────────────────────────────────
function updateSpark(rows) {
  const monCount = Array(12).fill(0);
  rows.forEach(r => {
    const m = r.date ? parseInt(r.date.slice(5,7)) - 1 : -1;
    if (m >= 0) monCount[m]++;
  });
  const max = Math.max(...monCount, 1);
  document.getElementById('spark').innerHTML = monCount.map((n,i) => `
    <div class="spark-col">
      <div class="spark-bar" style="height:${Math.max(2,(n/max*36)).toFixed(0)}px"></div>
      <div class="spark-lbl">${MONTHS[i][0]}</div>
    </div>`).join('');
}

// ── Offense pills ─────────────────────────────────────────────────────────────
function buildPills() {
  const el = document.getElementById('pill-group');
  const allPill = document.createElement('div');
  allPill.className = 'pill active';
  allPill.textContent = 'All';
  allPill.dataset.val = 'ALL';
  el.appendChild(allPill);

  offenseTypes.forEach(o => {
    const p = document.createElement('div');
    p.className = 'pill';
    p.textContent = o.replace('DRUG OFFENSE - ','').replace('NARCOTIC - ','').replace('CONTROLLED SUBSTANCE - ','').replace('MARIJUANA - ','');
    p.dataset.val = o;
    p.title = o;
    el.appendChild(p);
  });

  el.addEventListener('click', e => {
    const pill = e.target.closest('.pill');
    if (!pill) return;
    const val = pill.dataset.val;
    if (val === 'ALL') {
      activeOffenses = new Set(['ALL']);
      el.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.val === 'ALL'));
    } else {
      activeOffenses.delete('ALL');
      pill.classList.toggle('active');
      if (![...el.querySelectorAll('.pill.active')].filter(p=>p.dataset.val!=='ALL').length) {
        activeOffenses = new Set(['ALL']);
        el.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.val === 'ALL'));
      } else {
        el.querySelector('[data-val="ALL"]').classList.remove('active');
        activeOffenses = new Set([...el.querySelectorAll('.pill.active')].map(p=>p.dataset.val));
      }
    }
    render();
  });
}

function render() {
  const rows = getFiltered();
  renderDots(rows);
  updateStats(rows);
  updateZones(rows);
  updateSpark(rows);
}

buildPills();
render();
</script>
</body>
